<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم - منتجك معروف</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:15px}
.box{background:#fff;padding:15px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 2px 10px #0002}
h2{text-align:center}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#000;color:#fff;border:0;border-radius:8px;font-size:16px}
.item{background:#f9f9f9;padding:10px;border-radius:8px;margin:8px 0;display:flex;gap:10px;align-items:center}
.item img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.del{background:#ff3b30;padding:6px 10px;width:auto}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>🔐 لوحة تحكم منتجك معروف</h2>
<input type="password" id="pass" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
<p style="text-align:center;color:#888">كلمة السر: 1234</p>
</div>
<div class="box" id="adminBox" style="display:none">
<h2>🛍️ إضافة منتج جديد</h2>
<input id="name" placeholder="اسم المنتج">
<input id="price" placeholder="السعر - مثال: 5000">
<input id="img" placeholder="رابط صورة المنتج">
<textarea id="desc" placeholder="وصف المنتج"></textarea>
<button onclick="addProduct()">➕ إضافة المنتج</button>
<h3>المنتجات الحالية</h3>
<div id="list"></div>
<button onclick="openStore()" style="background:#25D366;margin-top:10px">👀 عرض المتجر</button>
</div>
<script>
let products = JSON.parse(localStorage.getItem('my_products')||'[]');
function login(){
 if(document.getElementById('pass').value=='1234'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  show();
 } else alert('كلمة السر غلط');
}
function show(){
 let h='';
 products.forEach((p,i)=>{
  h+=`<div class="item"><img src="${p.img||'https://via.placeholder.com/60'}"><div style="flex:1"><b>${p.name}</b><br>${p.price} ريال<br><small>${p.desc||''}</small></div><button class="del" onclick="delP(${i})">حذف</button></div>`;
 });
 document.getElementById('list').innerHTML = h || 'لا يوجد منتجات بعد';
}
function addProduct(){
 let n=document.getElementById('name').value;
 let pr=document.getElementById('price').value;
 if(!n||!pr) return alert('اكتب الاسم والسعر');
 products.push({name:n,price:pr,img:document.getElementById('img').value,desc:document.getElementById('desc').value});
 localStorage.setItem('my_products',JSON.stringify(products));
 document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';document.getElementById('desc').value='';
 show(); alert('تمت الإضافة ✅');
}
function delP(i){ products.splice(i,1); localStorage.setItem('my_products',JSON.stringify(products)); show(); }
function openStore(){ window.open('index.html','_blank'); }
</script>
</body>
</html>
