<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منتجك معروف</title>
<style>
body{font-family:Arial;background:#f9f9f9;margin:0;padding:0}
.header{background:#111;color:#fff;text-align:center;padding:25px 15px}
.header h1{margin:0;font-size:26px}
.header p{margin:5px;color:#25D366}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:800px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0002;text-align:center;padding-bottom:10px}
.card img{width:100%;height:160px;object-fit:cover}
.card b{display:block;margin:8px;font-size:16px}
.price{color:#0a9e4a;font-weight:bold;font-size:17px}
.card small{color:#666;display:block;padding:0 8px}
.cat{background:#eee;display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;margin:5px}
.btn{display:block;background:#25D366;color:#fff;margin:10px;padding:11px;border-radius:9px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>🛍️ منتجك معروف</h1>
<p>أفضل المنتجات اليمنية الأصلية - اطلبها واتساب</p>
</div>

<div class="grid" id="grid"></div>

<script>
let products = [
  {
    name: "عسل دوعني أصلي",
    price: 15000,
    image: "https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=600",
    description: "عسل طبيعي 100% من وادي دوعن",
    category: "عسل"
  },
  {
    name: "بن يمني فاخر",
    price: 8000,
    image: "https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=600",
    description: "بن حرازي درجة أولى",
    category: "بن"
  },
  {
    name: "عسل سدر",
    price: 20000,
    image: "https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=600",
    description: "عسل سدر دوعني ممتاز",
    category: "عسل"
  }
];

let grid = document.getElementById('grid');
products.forEach(p=>{
 grid.innerHTML += `<div class="card"><img src="${p.image}"><b>${p.name}</b><div class="price">${p.price} ريال</div><span class="cat">${p.category}</span><small>${p.description}</small><a class="btn" href="https://wa.me/967778917828?text=أريد طلب ${encodeURIComponent(p.name)} - السعر ${p.price} ريال" target="_blank">اطلب واتساب</a></div>`;
});
</script>
</body>
</html>
