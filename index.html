<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منتجك معروف - مونتاج احترافي</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff;text-align:center}
.hero{padding:60px 20px;background:linear-gradient(180deg,#000,#1a1400)}
.hero h1{font-size:42px;color:#f5c518;margin:10px}
.hero p{color:#ddd;font-size:18px}
.btn{display:inline-block;padding:14px 28px;margin:10px;border-radius:30px;text-decoration:none;font-weight:bold}
.wa{background:#25D366;color:#fff}
.work{background:#f5c518;color:#000}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;padding:20px}
.card{background:#1a1a1a;border:1px solid #f5c51833;border-radius:15px;padding:20px;width:280px}
.card h3{color:#f5c518}
.price{font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="hero">
<h1 id="title">منتجك معروف</h1>
<p id="subtitle">مونتاج يخلي فيديوهاتك تتصدر وتجيب زباين</p>
<a class="btn wa" href="https://wa.me/967782844444">اطلب على واتساب</a>
<a class="btn work" href="#services">شوف أعمالنا</a>
<p>⭐ أكثر من 500 فيديو تم مونتاجه</p>
</div>
<div class="cards" id="services"></div>
<script>
let products = JSON.parse(localStorage.getItem('muntajk')) || [
{title:"ريلز انستقرام",price:"5,000 ريال",desc:"مونتاج سريع وجذاب"},
{title:"فيديو يوتيوب",price:"10,000 ريال",desc:"مونتاج احترافي كامل"},
{title:"إعلان تجاري",price:"15,000 ريال",desc:"إعلان يبيع منتجك"}
];
let box=document.getElementById('services');
products.forEach(p=>{
box.innerHTML+=`<div class="card"><h3>${p.title}</h3><p>${p.desc}</p><div class="price">${p.price}</div><br><a class="btn wa" href="https://wa.me/967782844444?text=اشتي ${p.title}">اطلب</a></div>`
});
let t=localStorage.getItem('site_title'); if(t) document.getElementById('title').innerText=t;
let s=localStorage.getItem('site_sub'); if(s) document.getElementById('subtitle').innerText=s;
</script>
</body>
</html>
