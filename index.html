<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منتجك معروف</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:15px}
h1{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001;text-align:center;padding-bottom:10px}
.card img{width:100%;height:150px;object-fit:cover}
.card b{display:block;margin:8px}
.price{color:#25D366;font-weight:bold}
.btn{display:block;background:#25D366;color:#fff;margin:10px;padding:10px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<h1>🛍️ منتجك معروف</h1>
<p style="text-align:center">أفضل المنتجات اليمنية الأصلية</p>
<div class="grid" id="grid"></div>
<script>
let products = JSON.parse(localStorage.getItem('my_products')||'[]');
let grid = document.getElementById('grid');
if(products.length==0){
 grid.innerHTML = '<p style="grid-column:1/3;text-align:center">لا يوجد منتجات بعد، ارجع للوحة التحكم وأضف منتج</p>';
} else {
 products.forEach(p=>{
  grid.innerHTML += `<div class="card"><img src="${p.img||'https://via.placeholder.com/300'}"><b>${p.name}</b><div class="price">${p.price} ريال</div><small>${p.desc||''}</small><a class="btn" href="https://wa.me/967778917828?text=أريد ${encodeURIComponent(p.name)}" target="_blank">اطلب واتساب</a></div>`;
 });
}
</script>
</body>
</html>
